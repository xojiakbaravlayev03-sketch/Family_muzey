
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>XOJIAKBAR | FAMILY MUSEUM</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050505;color:#d9bc7b;
 font-family:Arial,sans-serif;overflow:hidden
}
#scene{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none}

#loading{
 position:fixed;inset:0;z-index:20;
 background:#050505;display:flex;flex-direction:column;
 justify-content:center;align-items:center;text-align:center
}
#loading h2{letter-spacing:4px;color:#d8b56f}
#loading small{color:#aaa;margin-top:10px}
#header{
 position:absolute;top:0;width:100%;text-align:center;
 padding:15px;background:linear-gradient(#000d,transparent);
 pointer-events:none
}
#title{font-size:19px;letter-spacing:4px}
#hallName{font-size:12px;margin-top:7px;color:#b7a17b}

#topButtons{
 position:absolute;top:85px;width:100%;
 display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:5px
}
button{
 background:#17120b;color:#dfc183;border:1px solid #89672f;
 border-radius:12px;padding:11px;font-size:12px
}
button:active{background:#473116;transform:scale(.96)}
#controls{
 position:absolute;bottom:15px;width:100%;padding:0 14px;
 display:flex;justify-content:space-between;align-items:end;
 pointer-events:none
}
#pad,#turn{pointer-events:auto}
#pad{
 display:grid;grid-template-columns:53px 53px 53px;
 grid-template-rows:50px 50px;gap:4px
}
#pad button{font-size:20px;padding:0}
#turn{display:flex;flex-direction:column;gap:5px}
#turn button{min-width:100px}
#message{
 position:absolute;bottom:145px;left:50%;transform:translateX(-50%);
 background:#17120de8;border:1px solid #604922;
 padding:9px 13px;border-radius:30px;font-size:12px;
 text-align:center;white-space:nowrap
}
#modal{
 display:none;position:fixed;inset:0;z-index:30;
 background:#000d;align-items:center;justify-content:center;padding:15px
}
#panel{
 background:#17120c;border:1px solid #b18a4c;border-radius:16px;
 padding:15px;width:100%;max-width:430px;max-height:90vh;overflow:auto
}
#bigPhoto{width:100%;max-height:40vh;object-fit:contain}
input,textarea{
 width:100%;padding:11px;margin:6px 0;
 background:#080808;color:#eee;border:1px solid #72552e;border-radius:8px
}
#story{white-space:pre-wrap;margin:10px 0;color:#c9b58f}
#file{display:none}
</style>
</head>
<body>

<div id="scene"></div>

<div id="loading">
 <h2>FAMILY MUSEUM</h2>
 <small id="loadText">3D muzey tayyorlanmoqda...</small>
</div>

<div id="header">
 <div id="title">FAMILY MUSEUM</div>
 <div id="hallName">Oilaviy xotiralar galereyasi</div>
</div>

<div id="topButtons">
 <button onclick="changeHall(-1)">◀ OLDINGI</button>
 <button onclick="document.getElementById('file').click()">＋ SURAT</button>
 <button onclick="changeHall(1)">KEYINGI ▶</button>
 <input id="file" type="file" accept="image/*">
</div>

<div id="message">Oilaviy muzeyga xush kelibsiz</div>

<div id="controls">
 <div id="pad">
  <div></div><button onclick="move(0,1)">▲</button><div></div>
  <button onclick="move(-1,0)">◀</button>
  <button onclick="move(0,-1)">▼</button>
  <button onclick="move(1,0)">▶</button>
 </div>
 <div id="turn">
  <button onclick="rotate(-0.25)">↶ BURILISH</button>
  <button onclick="rotate(0.25)">BURILISH ↷</button>
 </div>
</div>

<div id="modal">
 <div id="panel">
  <img id="bigPhoto">
  <h3 id="photoTitle"></h3>
  <div id="story"></div>
  <input id="nameInput" placeholder="Surat nomi">
  <textarea id="storyInput" rows="4" placeholder="Xotira yozing..."></textarea>
  <button onclick="savePhoto()">SAQLASH</button>
  <button onclick="closePhoto()">YOPISH</button>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.getElementById('scene');
const loading=document.getElementById('loading');
const loadText=document.getElementById('loadText');

try {

/* SCENE */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080706);
scene.fog=new THREE.Fog(0x080706,25,48);

const camera=new THREE.PerspectiveCamera(70,1,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
root.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.HemisphereLight(0xffd8a0,0x15110e,2));

const light=new THREE.PointLight(0xffc77b,130,50);
light.position.set(0,5,-8);
scene.add(light);

const playerLight=new THREE.PointLight(0xffc982,30,12);
scene.add(playerLight);

/* MATERIAL */
const wallMat=new THREE.MeshStandardMaterial({
 color:0x27211a,roughness:.85
});
const floorMat=new THREE.MeshStandardMaterial({
 color:0x30251a,roughness:.25,metalness:.3
});
const gold=new THREE.MeshStandardMaterial({
 color:0xb58b46,metalness:.65,roughness:.28
});
const darkGold=new THREE.MeshStandardMaterial({
 color:0x60421f,metalness:.5,roughness:.4
});

/* GROUPS */
const museum=new THREE.Group();
scene.add(museum);

let hall=0;
const halls=[
 "Oilaviy xotiralar galereyasi",
 "Bolalik xotiralari zali",
 "Oilamiz tarixi",
 "Qadrli insonlar galereyasi"
];

let paintings=[];
let uploaded=[];
let currentPainting=null;

try{
 uploaded=JSON.parse(localStorage.getItem('familyMuseum')||'[]');
 if(!Array.isArray(uploaded))uploaded=[];
}catch(e){uploaded=[]}

/* OBJECT HELPER */
function addBox(parent,w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

/* ARCH */
function createArch(z){
 const group=new THREE.Group();
 group.position.z=z;
 museum.add(group);

 addBox(group,.25,4,.35,gold,-2.7,2,0);
 addBox(group,.25,4,.35,gold,2.7,2,0);

 const curve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-2.7,3.9,0),
  new THREE.Vector3(-2.5,4.45,0),
  new THREE.Vector3(-1.8,4.95,0),
  new THREE.Vector3(0,5.15,0),
  new THREE.Vector3(1.8,4.95,0),
  new THREE.Vector3(2.5,4.45,0),
  new THREE.Vector3(2.7,3.9,0)
 ]);
 const arch=new THREE.Mesh(
  new THREE.TubeGeometry(curve,40,.16,10,false),gold
 );
 group.add(arch);

 addBox(group,5.8,.12,.4,gold,0,.1,0);
}

/* PICTURE */
const defaultImages=[
 "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1577720643272-265f09367456?auto=format&fit=crop&w=700&q=80",
 "https://images.unsplash.com/photo-1571115764595-644a1f56a55c?auto=format&fit=crop&w=700&q=80"
];

const textureLoader=new THREE.TextureLoader();

function createPainting(x,z,side,data){
 const group=new THREE.Group();
 group.position.set(x,2.6,z);
 group.rotation.y=side===1?Math.PI/2:-Math.PI/2;
 museum.add(group);

 const w=1.55,h=2.05;
 const frame=.12;

 addBox(group,w+frame*2,h+frame*2,.16,darkGold,0,0,0);
 addBox(group,w+frame*2,frame,.2,gold,0,h/2+frame/2,.05);
 addBox(group,w+frame*2,frame,.2,gold,0,-h/2-frame/2,.05);
 addBox(group,frame,h,.2,gold,-w/2-frame/2,0,.05);
 addBox(group,frame,h,.2,gold,w/2+frame/2,0,.05);

 const mat=new THREE.MeshBasicMaterial({color:0x19130c});
 const picture=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
 picture.position.z=.12;
 group.add(picture);

 const url=data?.data||defaultImages[Math.abs(Math.floor(z+side*3))%defaultImages.length];

 if(url){
  textureLoader.load(url,tex=>{
   tex.colorSpace=THREE.SRGBColorSpace;
   picture.material=new THREE.MeshBasicMaterial({map:tex});
  },undefined,()=>{});
 }

 group.userData={
  isPainting:true,
  photo:url,
  title:data?.name||"Oilaviy xotira",
  story:data?.story||"",
  upload:data||null
 };
 paintings.push(group);
}

/* BUILD HALL */
function buildMuseum(){
 museum.clear();
 paintings=[];

 const floor=new THREE.Mesh(new THREE.PlaneGeometry(15,42),floorMat);
 floor.rotation.x=-Math.PI/2;
 museum.add(floor);

 const ceiling=new THREE.Mesh(
  new THREE.PlaneGeometry(15,42),
  new THREE.MeshStandardMaterial({color:0x11100d})
 );
 ceiling.rotation.x=Math.PI/2;
 ceiling.position.y=6;
 museum.add(ceiling);

 addBox(museum,.3,6,42,wallMat,-7.2,3,0);
 addBox(museum,.3,6,42,wallMat,7.2,3,0);
 addBox(museum,14.4,6,.3,wallMat,0,3,-21);
 addBox(museum,14.4,6,.3,wallMat,0,3,21);

 for(const side of [-1,1]){
  const x=side*7.02;
  addBox(museum,.07,.12,41,gold,x,.5,0);
  addBox(museum,.07,.12,41,gold,x,5.5,0);
 }

 for(let z=-17;z<=17;z+=5.8)createArch(z);

 for(let i=0;i<6;i++){
  const z=-17+i*6.4;
  createPainting(-7.02,z,1,null);
  createPainting(7.02,z,-1,null);
 }

 uploaded.forEach((p,i)=>{
  createPainting(i%2===0?-7.02:7.02,-15+Math.floor(i/2)*4.5,i%2===0?1:-1,p);
 });

 for(let z=-18;z<=18;z+=4.5){
  const l=new THREE.PointLight(0xffd39a,28,9);
  l.position.set(0,5.2,z);
  museum.add(l);
 }

 document.getElementById('hallName').textContent=halls[hall];
}

/* SIMPLE 3D PERSON */
const avatar=new THREE.Group();
scene.add(avatar);

const skin=new THREE.MeshStandardMaterial({color:0xc99b73});
const clothes=new THREE.MeshStandardMaterial({color:0x24282e});
const pants=new THREE.MeshStandardMaterial({color:0x16191d});
const shoes=new THREE.MeshStandardMaterial({color:0x080808});

function bodyPart(geo,mat,x,y,z){
 const m=new THREE.Mesh(geo,mat);
 m.position.set(x,y,z);
 avatar.add(m);
 return m;
}

bodyPart(new THREE.CylinderGeometry(.32,.42,.95,16),clothes,0,1.35,0);
bodyPart(new THREE.SphereGeometry(.28,16,16),skin,0,2.05,0);
bodyPart(new THREE.CylinderGeometry(.07,.08,.32,12),skin,0,1.93,0);

bodyPart(new THREE.CylinderGeometry(.1,.12,.75,12),clothes,-.42,1.35,0);
bodyPart(new THREE.CylinderGeometry(.1,.12,.75,12),clothes,.42,1.35,0);
bodyPart(new THREE.CylinderGeometry(.12,.14,.85,12),pants,-.18,.45,0);
bodyPart(new THREE.CylinderGeometry(.12,.14,.85,12),pants,.18,.45,0);
bodyPart(new THREE.BoxGeometry(.28,.12,.4),shoes,-.18,.05,.08);
bodyPart(new THREE.BoxGeometry(.28,.12,.4),shoes,.18,.05,.08);

/* PLAYER */
let px=0,pz=3,yaw=0;

function move(x,z){
 const step=.65;
 px+=Math.sin(yaw)*z*step+Math.cos(yaw)*x*step;
 pz-=Math.cos(yaw)*z*step-Math.sin(yaw)*x*step;
 px=Math.max(-5.8,Math.min(5.8,px));
 pz=Math.max(-19,Math.min(19,pz));
 avatar.position.set(px,0,pz);
}
window.move=move;

window.rotate=a=>{
 yaw+=a;
 avatar.rotation.y=yaw;
};

window.changeHall=n=>{
 hall=(hall+n+4)%4;
 px=0;pz=3;yaw=0;
 avatar.position.set(px,0,pz);
 avatar.rotation.y=0;
 buildMuseum();
 message(halls[hall]);
};

/* CAMERA */
function updateCamera(){
 const distance=4;
 camera.position.set(
  px-Math.sin(yaw)*distance,
  2.8,
  pz+Math.cos(yaw)*distance
 );
 camera.lookAt(
  px+Math.sin(yaw)*1.5,
  1.5,
  pz-Math.cos(yaw)*1.5
 );
 playerLight.position.set(px,3,pz);
}

/* PHOTO CLICK */
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener('click',e=>{
 const r=renderer.domElement.getBoundingClientRect();
 pointer.x=(e.clientX-r.left)/r.width*2-1;
 pointer.y=-((e.clientY-r.top)/r.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hit=raycaster.intersectObjects(paintings,true);
 if(!hit.length)return;

 let obj=hit[0].object;
 while(obj&&!obj.userData.isPainting)obj=obj.parent;
 if(obj)openPhoto(obj.userData);
});

/* PHOTO WINDOW */
function openPhoto(p){
 currentPainting=p;
 document.getElementById('bigPhoto').src=p.photo||"";
 document.getElementById('photoTitle').textContent=p.title;
 document.getElementById('story').textContent=p.story||"Bu suratga hali xotira yozilmagan.";
 document.getElementById('nameInput').value=p.title||"";
 document.getElementById('storyInput').value=p.story||"";
 document.getElementById('modal').style.display='flex';
}

window.closePhoto=()=>{
 document.getElementById('modal').style.display='none';
};

window.savePhoto=()=>{
 if(!currentPainting)return;
 const name=document.getElementById('nameInput').value;
 const story=document.getElementById('storyInput').value;
 const p=currentPainting.upload;

 if(p){
  p.name=name;
  p.story=story;
  try{
   localStorage.setItem('familyMuseum',JSON.stringify(uploaded));
  }catch(e){
   message("Xotira to‘lib qoldi");
  }
 }
 currentPainting.title=name;
 currentPainting.story=story;
 document.getElementById('photoTitle').textContent=name;
 document.getElementById('story').textContent=story;
 closePhoto();
 message("Xotira saqlandi");
};

/* UPLOAD */
document.getElementById('file').addEventListener('change',e=>{
 const file=e.target.files[0];
 if(!file)return;

 const reader=new FileReader();
 reader.onload=()=>{
  const p={
   data:reader.result,
   name:file.name,
   story:""
  };
  uploaded.push(p);

  try{
   localStorage.setItem('familyMuseum',JSON.stringify(uploaded));
   buildMuseum();
   message("Surat muzeyga qo‘shildi");
  }catch(err){
   uploaded.pop();
   message("Surat juda katta. Kichikroq rasm tanlang.");
  }
 };
 reader.readAsDataURL(file);
 e.target.value="";
});

/* TOUCH LOOK */
let dragging=false,lastX=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointercancel',()=>dragging=false);

renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 yaw+=(e.clientX-lastX)*.005;
 lastX=e.clientX;
 avatar.rotation.y=yaw;
});

/* MESSAGE */
function message(t){
 document.getElementById('message').textContent=t;
}

/* RENDER */
buildMuseum();

function resize(){
 const w=root.clientWidth;
 const h=root.clientHeight;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}
window.addEventListener('resize',resize);
resize();

function animate(){
 requestAnimationFrame(animate);
 updateCamera();
 renderer.render(scene,camera);
}
animate();

loadText.textContent="Muzey tayyor!";
setTimeout(()=>loading.style.display='none',800);

}catch(error){
 console.error(error);
 loadText.textContent="Xatolik: "+error.message;
}
</script>
</body>
</html>
