
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Family Museum 3D</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#d8bd83;font-family:Arial;overflow:hidden}
#scene{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none}

#header{
position:absolute;top:0;left:0;right:0;
padding:15px;text-align:center;
background:linear-gradient(#000c,transparent);
pointer-events:none
}
#title{font-size:19px;letter-spacing:4px;font-weight:bold;color:#dfbd76}
#hallName{margin-top:6px;font-size:12px;color:#c8b28b}

#topButtons{
position:absolute;top:80px;left:0;right:0;
display:flex;justify-content:center;flex-wrap:wrap;gap:6px
}
button{
background:linear-gradient(145deg,#21190e,#090806);
border:1px solid #97733d;color:#e4c98c;
border-radius:13px;padding:12px 14px;font-size:13px
}
button:active{transform:scale(.94);background:#4a3216}

#controls{
position:absolute;bottom:18px;left:0;right:0;
display:flex;justify-content:space-between;align-items:end;
padding:0 18px;pointer-events:none
}
#pad,#turn{pointer-events:auto}
#pad{
display:grid;grid-template-columns:58px 58px 58px;
grid-template-rows:54px 54px;gap:5px
}
#pad button{font-size:22px;padding:0}
#turn{display:flex;flex-direction:column;gap:6px}
#turn button{min-width:105px}

#message{
position:absolute;bottom:160px;left:50%;
transform:translateX(-50%);
background:#100d09dd;color:#ddc58f;
padding:9px 14px;border-radius:20px;font-size:12px;
white-space:nowrap;text-align:center
}
#file{display:none}

#modal{
display:none;position:fixed;inset:0;z-index:9;
background:#000e;align-items:center;justify-content:center;padding:12px
}
#panel{
width:100%;max-width:430px;max-height:92vh;overflow:auto;
background:#15110b;border:1px solid #b28a49;border-radius:15px;
padding:15px;text-align:center
}
#bigPhoto{width:100%;max-height:45vh;object-fit:contain;border:3px solid #9b763d}
input,textarea{
width:100%;padding:10px;margin:7px 0;background:#090909;
color:white;border:1px solid #70552d;border-radius:8px
}
#story{white-space:pre-wrap;text-align:left;color:#d9c69f}
#loading{
position:absolute;inset:0;background:#080706;z-index:20;
display:flex;align-items:center;justify-content:center;
flex-direction:column;color:#d4b36e;letter-spacing:2px;
}
#loading small{margin-top:12px;color:#a99a7a;letter-spacing:0}
</style>
</head>
<body>

<div id="scene"></div>

<div id="loading">
  <div>FAMILY MUSEUM</div>
  <small id="loadText">3D muzey yuklanmoqda...</small>
</div>

<div id="header">
 <div id="title">FAMILY MUSEUM</div>
 <div id="hallName">Oilaviy xotiralar galereyasi</div>
</div>

<div id="topButtons">
 <button onclick="changeHall(-1)">◀ OLDINGI ZAL</button>
 <button onclick="document.getElementById('file').click()">＋ SURAT</button>
 <button onclick="changeHall(1)">KEYINGI ZAL ▶</button>
 <input id="file" type="file" accept="image/*">
</div>

<div id="message">Muzeyni tomosha qiling</div>

<div id="controls">
 <div id="pad">
  <div></div><button onclick="move(0,1)">▲</button><div></div>
  <button onclick="move(-1,0)">◀</button>
  <button onclick="move(0,-1)">▼</button>
  <button onclick="move(1,0)">▶</button>
 </div>
 <div id="turn">
  <button onclick="rotate(-0.25)">↶ BURILISH</button>
  <button onclick="rotate(0.25)">BURILISH ↷</button>
 </div>
</div>

<div id="modal">
 <div id="panel">
  <img id="bigPhoto">
  <h3 id="photoTitle"></h3>
  <div id="story"></div>
  <input id="nameInput" placeholder="Surat nomi">
  <textarea id="storyInput" rows="4" placeholder="Xotira yozing"></textarea>
  <button onclick="savePhoto()">SAQLASH</button>
  <button onclick="closePhoto()">YOPISH</button>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

/* ==============================
   SCENE
================================*/
const root=document.getElementById('scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070605);
scene.fog=new THREE.Fog(0x070605,30,65);

const camera=new THREE.PerspectiveCamera(65,1,.1,100);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
root.appendChild(renderer.domElement);

const loader=new GLTFLoader();

/* ==============================
   LIGHTS
================================*/
scene.add(new THREE.HemisphereLight(0xffd9a0,0x111015,1.5));

const centralLight=new THREE.PointLight(0xffc879,100,50);
centralLight.position.set(0,5,-12);
scene.add(centralLight);

const entranceLight=new THREE.PointLight(0xffba63,55,30);
entranceLight.position.set(0,4,5);
scene.add(entranceLight);

/* ==============================
   MATERIALS
================================*/
const materials={
 wall:new THREE.MeshStandardMaterial({
  color:0x25201c,roughness:.83
 }),
 floor:new THREE.MeshStandardMaterial({
  color:0x342923,roughness:.24,metalness:.35
 }),
 ceiling:new THREE.MeshStandardMaterial({
  color:0x11100e,roughness:.85
 }),
 gold:new THREE.MeshStandardMaterial({
  color:0xb58b46,metalness:.7,roughness:.25
 }),
 goldDark:new THREE.MeshStandardMaterial({
  color:0x65441e,metalness:.6,roughness:.35
 }),
 black:new THREE.MeshStandardMaterial({
  color:0x090807
 })
};

/* ==============================
   MUSEUM
================================*/
const museum=new THREE.Group();
scene.add(museum);

let hall=0;
const halls=[
 "Oilaviy xotiralar galereyasi",
 "Bolalik xotiralari zali",
 "Oilamiz tarixi",
 "Qadrli insonlar galereyasi"
];

let paintings=[];
let uploaded=[];
let currentPainting=null;

function mesh(parent,geometry,material,x,y,z){
 const m=new THREE.Mesh(geometry,material);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

/* ==============================
   ARCH DESIGN
================================*/
function arch(z){
 const g=new THREE.Group();
 g.position.z=z;
 museum.add(g);

 // Arch columns
 const columnGeo=new THREE.BoxGeometry(.32,3.8,.36);
 mesh(g,columnGeo,materials.gold,-2.7,1.9,0);
 mesh(g,columnGeo,materials.gold,2.7,1.9,0);

 // Rounded arch using curve tube
 const curve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-2.7,3.8,0),
  new THREE.Vector3(-2.5,4.4,0),
  new THREE.Vector3(-1.8,5.0,0),
  new THREE.Vector3(0,5.15,0),
  new THREE.Vector3(1.8,5.0,0),
  new THREE.Vector3(2.5,4.4,0),
  new THREE.Vector3(2.7,3.8,0)
 ]);
 const tube=new THREE.TubeGeometry(curve,48,.17,10,false);
 mesh(g,tube,materials.gold,0,0,0);

 // inner dark arch trim
 const innerCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-2.35,3.8,-.1),
  new THREE.Vector3(-2.2,4.35,-.1),
  new THREE.Vector3(-1.55,4.75,-.1),
  new THREE.Vector3(0,4.95,-.1),
  new THREE.Vector3(1.55,4.75,-.1),
  new THREE.Vector3(2.2,4.35,-.1),
  new THREE.Vector3(2.35,3.8,-.1)
 ]);
 mesh(g,new THREE.TubeGeometry(innerCurve,48,.07,8,false),materials.goldDark,0,0,0);

 // Arch base trim
 mesh(g,new THREE.BoxGeometry(5.8,.12,.4),materials.gold,0,.08,0);
}

/* ==============================
   PAINTINGS
================================*/
const artURLs=[
 "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=700&q=85",
 "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=700&q=85",
 "https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&w=700&q=85",
 "https://images.unsplash.com/photo-1577720643272-265f09367456?auto=format&fit=crop&w=700&q=85",
 "https://images.unsplash.com/photo-1571115764595-644a1f56a55c?auto=format&fit=crop&w=700&q=85"
];

function painting(x,z,side,data=null){
 const group=new THREE.Group();
 group.position.set(x,2.65,z);

 if(side===1)group.rotation.y=-Math.PI/2;
 if(side===-1)group.rotation.y=Math.PI/2;
 museum.add(group);

 const w=1.55,h=2.0,b=.12;

 // Frame body
 mesh(group,new THREE.BoxGeometry(w+2*b,h+2*b,.18),materials.goldDark,0,0,0);
 mesh(group,new THREE.BoxGeometry(w+2*b,b,.22),materials.gold,0,h/2+b/2,.05);
 mesh(group,new THREE.BoxGeometry(w+2*b,b,.22),materials.gold,0,-h/2-b/2,.05);
 mesh(group,new THREE.BoxGeometry(b,h,.22),materials.gold,-w/2-b/2,0,.05);
 mesh(group,new THREE.BoxGeometry(b,h,.22),materials.gold,w/2+b/2,0,.05);

 // Inner trim
 mesh(group,new THREE.BoxGeometry(w+.08,.045,.18),materials.goldDark,0,h/2-.05,.1);
 mesh(group,new THREE.BoxGeometry(w+.08,.045,.18),materials.goldDark,0,-h/2+.05,.1);

 // Artwork
 const artMat=new THREE.MeshBasicMaterial({color:0x1a120c});
 const canvas=mesh(group,new THREE.PlaneGeometry(w,h),artMat,0,0,.13);

 let photo=data?.data || artURLs[Math.floor(Math.abs(z*3+side*7))%artURLs.length];

 const tex=new THREE.TextureLoader();
 tex.load(photo,t=>{
  t.colorSpace=THREE.SRGBColorSpace;
  canvas.material=new THREE.MeshBasicMaterial({map:t});
  canvas.material.needsUpdate=true;
 },undefined,()=>{});

 // Picture light
 const lamp=new THREE.SpotLight(0xffd08a,22,5,Math.PI/5,.5,1);
 lamp.position.set(0,1.45,.7);
 lamp.target.position.set(0,.3,0);
 group.add(lamp,lamp.target);

 group.userData={
  isPainting:true,
  photo,
  title:data?.name||"Muzey portreti",
  story:data?.story||""
 };
 paintings.push(group);
 return group;
}

/* ==============================
   HALL BUILD
================================*/
function buildMuseum(){
 museum.clear();
 paintings=[];

 // Corridor floor
 mesh(museum,new THREE.PlaneGeometry(15,42),materials.floor,0,0,0)
 .rotation.x=-Math.PI/2;

 // Ceiling
 mesh(museum,new THREE.PlaneGeometry(15,42),materials.ceiling,0,6,0)
 .rotation.x=Math.PI/2;

 // Long walls
 mesh(museum,new THREE.BoxGeometry(.3,6,42),materials.wall,-7.2,3,0);
 mesh(museum,new THREE.BoxGeometry(.3,6,42),materials.wall,7.2,3,0);

 // Back and entrance walls
 mesh(museum,new THREE.BoxGeometry(14.4,6,.3),materials.wall,0,3,-21);
 mesh(museum,new THREE.BoxGeometry(14.4,6,.3),materials.wall,0,3,21);

 // Golden wall trim
 for(const side of [-1,1]){
  const x=side*7.02;
  mesh(museum,new THREE.BoxGeometry(.08,.12,41),materials.gold,x,.45,0);
  mesh(museum,new THREE.BoxGeometry(.08,.12,41),materials.gold,x,5.55,0);
  mesh(museum,new THREE.BoxGeometry(.08,.08,41),materials.goldDark,x,1.1,0);
 }

 // Reflective floor accents
 for(const x of [-6.4,6.4]){
  mesh(museum,new THREE.BoxGeometry(.05,.02,41),materials.gold,x,.015,0);
 }

 // Repeated arches
 for(let z=-17;z<=17;z+=5.8){
  arch(z);
 }

 // Museum paintings
 for(let i=0;i<6;i++){
  const z=-17+i*6.4;
  painting(-7.02,z,1);
  painting(7.02,z,-1);
 }

 // Additional uploaded pictures
 uploaded.forEach((p,i)=>{
  const side=i%2===0?1:-1;
  const z=-16+Math.floor(i/2)*4.8;
  painting(side*7.02,z,side,p);
 });

 // Lights along gallery
 for(let z=-18;z<=18;z+=4.5){
  const light=new THREE.PointLight(0xffd39a,32,9);
  light.position.set(0,5.3,z);
  museum.add(light);

  mesh(museum,new THREE.SphereGeometry(.08,12,12),materials.gold,0,5.82,z);
 }

 document.getElementById('hallName').textContent=halls[hall];
}

/* ==============================
   REAL AVATAR
================================*/
let avatar=null;
let mixer=null;
let walkAction=null;
let idleAction=null;
let activeAction=null;
let avatarLoaded=false;

const avatarURL=
'https://files.innerscene.com/library/relaxed-walk-sam-3d-person-animated-732f1206/b11d02f72ad777e03d68/relaxed-walk-sam-3d-person-animated.glb';

loader.load(
 avatarURL,
 gltf=>{
  avatar=gltf.scene;
  avatar.scale.set(1,1,1);
  avatar.position.set(0,0,3);
  avatar.rotation.y=Math.PI;

  avatar.traverse(o=>{
   if(o.isMesh){
    o.castShadow=true;
    o.receiveShadow=true;
   }
  });

  scene.add(avatar);

  if(gltf.animations && gltf.animations.length){
   mixer=new THREE.AnimationMixer(avatar);
   walkAction=mixer.clipAction(gltf.animations[0]);
   walkAction.play();
   walkAction.paused=true;
   activeAction=walkAction;
  }

  avatarLoaded=true;
  document.getElementById('loadText').textContent="Muzey tayyor";
  setTimeout(()=>document.getElementById('loading').style.display='none',500);
 },
 xhr=>{
  if(xhr.total){
   document.getElementById('loadText').textContent=
   "3D odam yuklanmoqda "+Math.round(xhr.loaded/xhr.total*100)+"%";
  }
 },
 err=>{
  console.error(err);
  document.getElementById('loadText').textContent=
  "Avatar yuklanmadi. Internetni tekshiring.";
  setTimeout(()=>document.getElementById('loading').style.display='none',1800);
 }
);

/* ==============================
   MOVEMENT
================================*/
let playerX=0,playerZ=3;
let yaw=0;
let isMoving=false;
let moveDirection=0;

window.move=(x,z)=>{
 if(!avatar)return;

 const forward=Math.cos(yaw);
 const side=Math.sin(yaw);

 playerX+=x*.5;
 playerZ-=z*.5;

 playerX=Math.max(-5.7,Math.min(5.7,playerX));
 playerZ=Math.max(-19,Math.min(19,playerZ));

 avatar.position.set(playerX,0,playerZ);
 isMoving=(x!==0||z!==0);

 if(isMoving && walkAction){
  walkAction.paused=false;
  walkAction.timeScale=1;
 }else if(walkAction){
  walkAction.paused=true;
 }
};

window.rotate=a=>{
 yaw+=a;
 if(avatar)avatar.rotation.y=Math.PI+yaw;
};

window.changeHall=n=>{
 hall=(hall+n+halls.length)%halls.length;
 playerX=0;playerZ=3;yaw=0;
 if(avatar)avatar.position.set(playerX,0,playerZ);
 if(avatar)avatar.rotation.y=Math.PI;
 buildMuseum();
 message(halls[hall]);
};

/* ==============================
   CAMERA
================================*/
function cameraUpdate(){
 if(!avatar)return;

 const distance=4.2;
 const cameraX=playerX+Math.sin(yaw)*distance;
 const cameraZ=playerZ+Math.cos(yaw)*distance;

 camera.position.set(cameraX,2.65,cameraZ);

 camera.lookAt(
  playerX+Math.sin(yaw)*1.5,
  1.5,
  playerZ-Math.cos(yaw)*2.3
 );
}

/* ==============================
   PAINTING INTERACTION
================================*/
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown',e=>{
 const r=renderer.domElement.getBoundingClientRect();
 pointer.x=(e.clientX-r.left)/r.width*2-1;
 pointer.y=-((e.clientY-r.top)/r.height)*2+1;
 raycaster.setFromCamera(pointer,camera);

 const hits=raycaster.intersectObjects(paintings,true);
 if(!hits.length)return;

 let p=hits[0].object;
 while(p&&!p.userData.isPainting)p=p.parent;

 if(p&&p.userData.photo)openPhoto(p.userData);
});

function openPhoto(p){
 currentPainting=p;
 document.getElementById('bigPhoto').src=p.photo;
 document.getElementById('photoTitle').textContent=p.title;
 document.getElementById('story').textContent=p.story||"Bu suratga xotira yozilmagan.";
 document.getElementById('nameInput').value=p.title;
 document.getElementById('storyInput').value=p.story;
 document.getElementById('modal').style.display='flex';
}

window.closePhoto=()=>document.getElementById('modal').style.display='none';

window.savePhoto=()=>{
 if(!currentPainting)return;
 currentPainting.title=document.getElementById('nameInput').value;
 currentPainting.story=document.getElementById('storyInput').value;

 const p=uploaded.find(x=>x.data===currentPainting.photo);
 if(p){
  p.name=currentPainting.title;
  p.story=currentPainting.story;
 }
 localStorage.setItem('familyMuseum',JSON.stringify(uploaded));
 buildMuseum();
 closePhoto();
 message("Xotira saqlandi");
};

/* ==============================
   UPLOAD
================================*/
document.getElementById('file').addEventListener('change',e=>{
 const file=e.target.files[0];
 if(!file)return;

 const reader=new FileReader();
 reader.onload=()=>{
  uploaded.push({
   data:reader.result,
   name:file.name,
   story:""
  });

  try{
   localStorage.setItem('familyMuseum',JSON.stringify(uploaded));
  }catch(err){
   message("Brauzer xotirasi to‘ldi");
  }

  buildMuseum();
  message("Surat muzeyga qo‘shildi");
 };
 reader.readAsDataURL(file);
 e.target.value='';
});

/* ==============================
   TOUCH CAMERA
================================*/
let dragging=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;lastX=e.clientX;
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 yaw+=(e.clientX-lastX)*.005;
 lastX=e.clientX;
});

/* ==============================
   STATUS
================================*/
function message(t){
 document.getElementById('message').textContent=t;
}

/* ==============================
   LOAD / LOOP
================================*/
try{
 uploaded=JSON.parse(localStorage.getItem('familyMuseum')||'[]');
}catch(e){
 uploaded=[];
}

buildMuseum();

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=clock.getDelta();

 if(mixer)mixer.update(dt);
 cameraUpdate();

 renderer.render(scene,camera);
}
animate();

/* ==============================
   RESIZE
================================*/
function resize(){
 const w=root.clientWidth;
 const h=root.clientHeight;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}
window.addEventListener('resize',resize);
resize();
</script>
</body>
</html>
