
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Family Museum | Xojiakbar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090c;color:#e9d5a5;font-family:Arial}
header{background:#0d0e12;text-align:center;padding:14px;border-bottom:1px solid #8c6a35}
h1{font-size:22px;letter-spacing:3px;color:#d7b36b;margin:5px}
#roomTitle{font-size:12px;color:#b8a17a}
button{cursor:pointer;background:linear-gradient(#292318,#100e0a);color:#e8cc8d;border:1px solid #92713b;border-radius:12px;padding:11px;margin:4px}
button:active{transform:scale(.96);background:#4a3820}
#scene{width:100%;height:55vh;min-height:320px;touch-action:none}
#status{text-align:center;font-size:12px;padding:8px;color:#c7b78c}
#toolbar{text-align:center;padding:5px}
#pad{display:grid;grid-template-columns:60px 60px 60px;justify-content:center;gap:2px}
#pad button{height:52px;font-size:20px}
#upload{display:none}
#modal{display:none;position:fixed;z-index:5;inset:0;background:#000e;align-items:center;justify-content:center;padding:16px}
#card{width:95%;max-width:500px;max-height:90vh;overflow:auto;background:#16130f;border:1px solid #b28b49;padding:16px;border-radius:15px;text-align:center}
#bigPhoto{max-width:100%;max-height:55vh;object-fit:contain;border:4px solid #b28b49}
input,textarea{width:100%;background:#0d0d0d;color:#eee;border:1px solid #76603a;padding:10px;border-radius:8px;margin:6px 0}
#storyText{white-space:pre-wrap;text-align:left;color:#d6c39b}
</style>
</head>
<body>
<header>
<h1>🏛 FAMILY MUSEUM</h1>
<div id="roomTitle">Oilaviy xotiralar muzeyi</div>
<button onclick="changeRoom(-1)">◀ Oldingi zal</button>
<button onclick="changeRoom(1)">Keyingi zal ▶</button>
<button onclick="document.getElementById('file').click()">＋ Surat qo‘shish</button>
<input id="file" type="file" accept="image/*" hidden>
</header>

<div id="scene"></div>
<div id="status">Muzeyni tomosha qiling • Barmoq bilan aylantiring</div>

<div id="toolbar">
<div id="pad">
<div></div><button onclick="move(0,1)">⬆</button><div></div>
<button onclick="move(-1,0)">⬅</button><button onclick="move(0,-1)">⬇</button><button onclick="move(1,0)">➡</button>
</div>
<button onclick="rotate(-.25)">↶ Chapga burilish</button>
<button onclick="rotate(.25)">O‘ngga burilish ↷</button>
</div>

<div id="modal">
<div id="card">
<img id="bigPhoto">
<h3 id="photoName"></h3>
<div id="storyText"></div>
<input id="editName" placeholder="Surat nomi">
<textarea id="editStory" rows="3" placeholder="Oilaviy xotira yoki hikoya..."></textarea>
<button onclick="saveStory()">💾 Xotirani saqlash</button>
<button onclick="closeModal()">Yopish ✕</button>
</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const sceneBox=document.getElementById('scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#090a0e');
scene.fog=new THREE.Fog(0x090a0e,22,48);

const camera=new THREE.PerspectiveCamera(65,1,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
sceneBox.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe3b0,0x181820,2));
const lamp=new THREE.PointLight(0xffd49a,100,40);
lamp.position.set(0,5,0);scene.add(lamp);

const mats={
wall:new THREE.MeshStandardMaterial({color:0x20232c,roughness:.85}),
floor:new THREE.MeshStandardMaterial({color:0x292019,roughness:.3,metalness:.2}),
gold:new THREE.MeshStandardMaterial({color:0xb48b47,metalness:.65,roughness:.3}),
dark:new THREE.MeshStandardMaterial({color:0x17120e}),
skin:new THREE.MeshStandardMaterial({color:0xb98b6a}),
shirt:new THREE.MeshStandardMaterial({color:0x252a32}),
pants:new THREE.MeshStandardMaterial({color:0x161719})
};

let roomGroup=new THREE.Group();scene.add(roomGroup);
let avatar=new THREE.Group();scene.add(avatar);
let room=0,yaw=0,playerX=0,playerZ=2;
let paintings=[],photos=[];
const names=["Oilaviy xotiralar zali","Bolalik galereyasi","Oilamiz tarixi","Qadrli insonlar zali"];

function mesh(geo,mat,x,y,z,parent=roomGroup){
const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function buildAvatar(){
avatar.clear();
mesh(new THREE.SphereGeometry(.23,18,16),mats.skin,0,1.85,0,avatar);
mesh(new THREE.CapsuleGeometry(.28,.65,6,12),mats.shirt,0,1.15,0,avatar);
mesh(new THREE.CapsuleGeometry(.11,.5,4,8),mats.shirt,-.38,1.25,0,avatar);
mesh(new THREE.CapsuleGeometry(.11,.5,4,8),mats.shirt,.38,1.25,0,avatar);
mesh(new THREE.CapsuleGeometry(.12,.55,4,8),mats.pants,-.15,.45,0,avatar);
mesh(new THREE.CapsuleGeometry(.12,.55,4,8),mats.pants,.15,.45,0,avatar);
mesh(new THREE.BoxGeometry(.23,.12,.4),mats.dark,-.15,.12,.05,avatar);
mesh(new THREE.BoxGeometry(.23,.12,.4),mats.dark,.15,.12,.05,avatar);
}
buildAvatar();

function makeFrame(x,y,z,photo,title,story){
const g=new THREE.Group();g.position.set(x,y,z);roomGroup.add(g);
const w=1.55,h=1.95,b=.13;
mesh(new THREE.BoxGeometry(w+2*b,b,.14),mats.gold,0,h/2+b/2,0,g);
mesh(new THREE.BoxGeometry(w+2*b,b,.14),mats.gold,0,-h/2-b/2,0,g);
mesh(new THREE.BoxGeometry(b,h,.14),mats.gold,-w/2-b/2,0,0,g);
mesh(new THREE.BoxGeometry(b,h,.14),mats.gold,w/2+b/2,0,0,g);
const backing=mesh(new THREE.PlaneGeometry(w,h),mats.dark,0,0,.09,g);
if(photo){
const texture=new THREE.TextureLoader().load(photo);
texture.colorSpace=THREE.SRGBColorSpace;
const pic=mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:texture}),0,0,.12,g);
}
g.userData={painting:true,photo,title,story};
paintings.push(g);
return g;
}

function createRoom(){
roomGroup.clear();paintings=[];
const roomColors=[0x20232c,0x26201b,0x1c2526,0x25201e];
mats.wall.color.setHex(roomColors[room%4]);

mesh(new THREE.PlaneGeometry(18,18),mats.floor,0,0,0).rotation.x=-Math.PI/2;
mesh(new THREE.PlaneGeometry(18,18),mats.dark,0,6,0).rotation.x=Math.PI/2;
mesh(new THREE.BoxGeometry(14,6,.35),mats.wall,0,3,-7);
mesh(new THREE.BoxGeometry(14,6,.35),mats.wall,0,3,7);
mesh(new THREE.BoxGeometry(.35,6,14),mats.wall,-7,3,0);
mesh(new THREE.BoxGeometry(.35,6,14),mats.wall,7,3,0);

// Classic wall trims
for(const z of [-6.7,6.7]){
mesh(new THREE.BoxGeometry(13.5,.12,.15),mats.gold,0,.45,z);
mesh(new THREE.BoxGeometry(13.5,.12,.15),mats.gold,0,5.5,z);
}
for(let i=0;i<4;i++){
makeFrame(-4.8+i*3.2,3,-6.77,null,"Oilaviy portret","");
makeFrame(-6.77,3,-4.5+i*2.8,null,"Oilaviy portret","");
makeFrame(6.77,3,-4.5+i*2.8,null,"Oilaviy portret","");
}
// Arka doorway visual at rear wall
mesh(new THREE.BoxGeometry(2.4,3.3,.25),mats.dark,0,1.7,6.8);
mesh(new THREE.BoxGeometry(2.65,.15,.3),mats.gold,0,3.3,6.65);
mesh(new THREE.BoxGeometry(.15,3.3,.3),mats.gold,-1.25,1.65,6.65);
mesh(new THREE.BoxGeometry(.15,3.3,.3),mats.gold,1.25,1.65,6.65);

// User uploaded framed photos
photos.forEach((p,i)=>makeFrame(-4+i*2.3,3,-6.78,p.data,p.name,p.story));
avatar.position.set(playerX,0,playerZ);
document.getElementById('roomTitle').textContent=names[room%names.length];
}

function changeRoom(n){
room=(room+n+names.length)%names.length;
playerX=0;playerZ=2;yaw=0;createRoom();
status("Siz "+names[room]+" ga o‘tdingiz");
}
window.changeRoom=changeRoom;

function status(t){document.getElementById('status').textContent=t}
function move(x,z){
const dx=Math.cos(yaw)*x+Math.sin(yaw)*z;
const dz=-Math.sin(yaw)*x+Math.cos(yaw)*z;
playerX=Math.max(-5.3,Math.min(5.3,playerX+dx*.45));
playerZ=Math.max(-5.2,Math.min(5.2,playerZ+dz*.45));
avatar.position.set(playerX,0,playerZ);
}
window.move=move;
window.rotate=a=>yaw+=a;

let drag=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{
drag=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointercancel',()=>drag=false);
renderer.domElement.addEventListener('pointermove',e=>{
if(!drag)return;yaw+=(e.clientX-lastX)*.005;lastX=e.clientX;
});

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{
const r=renderer.domElement.getBoundingClientRect();
mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
ray.setFromCamera(mouse,camera);
const hits=ray.intersectObjects(paintings,true);
if(hits.length){
let p=hits[0].object;
while(p&&!p.userData.painting)p=p.parent;
if(p&&p.userData.photo)openPhoto(p.userData);
}
});

function openPhoto(p){
document.getElementById('bigPhoto').src=p.photo;
document.getElementById('photoName').textContent=p.title||"Oilaviy surat";
document.getElementById('storyText').textContent=p.story||"Bu suratga oilaviy xotira yozilmagan.";
document.getElementById('editName').value=p.title||"";
document.getElementById('editStory').value=p.story||"";
document.getElementById('modal').style.display='flex';
window.currentPhoto=p;
}
window.closeModal=()=>document.getElementById('modal').style.display='none';
window.saveStory=()=>{
const p=window.currentPhoto;
if(!p)return;
p.title=document.getElementById('editName').value;
p.story=document.getElementById('editStory').value;
const i=photos.findIndex(x=>x.data===p.photo);
if(i>=0){photos[i].name=p.title;photos[i].story=p.story;}
try{localStorage.setItem('familyMuseum',JSON.stringify(photos));}catch(e){}
createRoom();closeModal();status("Xotira saqlandi");
};

document.getElementById('file').addEventListener('change',e=>{
const f=e.target.files[0];if(!f)return;
const reader=new FileReader();
reader.onload=()=>{
const p={data:reader.result,name:f.name,story:""};
photos.push(p);
try{localStorage.setItem('familyMuseum',JSON.stringify(photos));}
catch(err){status("Surat brauzer xotirasiga sig‘madi");}
createRoom();status("Surat muzey devoriga joylandi");
};
reader.readAsDataURL(f);e.target.value="";
});

try{photos=JSON.parse(localStorage.getItem('familyMuseum')||"[]");}catch(e){photos=[];}
createRoom();

function resize(){
const w=sceneBox.clientWidth,h=sceneBox.clientHeight;
camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
}
resize();window.addEventListener('resize',resize);

function animate(){
requestAnimationFrame(animate);
const back=new THREE.Vector3(Math.sin(yaw)*4,2.8,Math.cos(yaw)*4);
camera.position.set(playerX+back.x,back.y,playerZ+back.z);
camera.lookAt(playerX,1.3,playerZ-2.5);
avatar.rotation.y=yaw;
renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
